{% extends "base.html" %}
{% block content %}
<h1>Archivos en Floci S3</h1>
<div id="tree" class="tree"></div>

<script>
async function load() {
  const r = await fetch('/api/files');
  const files = await r.json();
  document.getElementById('tree').innerHTML = buildTree(files);
}

function buildTree(files) {
  const root = { children: {}, files: [] };
  for (const f of files) {
    const parts = f.key.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!node.children[parts[i]])
        node.children[parts[i]] = { children: {}, files: [], size: 0 };
      node = node.children[parts[i]];
    }
    node.size += f.size;
    node.files.push(f);
  }
  return render(root, '');
}

function fmt(byte) {
  if (byte < 1024) return byte + ' B';
  if (byte < 1048576) return (byte / 1024).toFixed(1) + ' KB';
  return (byte / 1048576).toFixed(1) + ' MB';
}

function icon(key) {
  if (key.endsWith('.parquet')) return '&#x1F5C2;&#xFE0F;';
  if (key.endsWith('.avro')) return '&#x1F4CB;';
  if (key.endsWith('.json')) return '&#x1F4DD;';
  if (key.endsWith('.stats')) return '&#x1F4CA;';
  return '&#x1F4C4;';
}

function countFiles(node) {
  let c = node.files.length;
  for (const k of Object.keys(node.children)) c += countFiles(node.children[k]);
  return c;
}

function render(node, prefix) {
  const folders = Object.keys(node.children).sort();
  const sortedFiles = [...node.files].sort((a, b) => a.key.localeCompare(b.key));
  let html = '<ul>';
  for (const name of folders) {
    const child = node.children[name];
    const nf = countFiles(child);
    html += `<li><details><summary>&#x1F4C1; <b>${name}</b> <span class="muted">(${nf} archivos, ${fmt(child.size)})</span></summary>${render(child, prefix + name + '/')}</details></li>`;
  }
  for (const f of sortedFiles) {
    const fn = f.key.split('/').pop();
    html += `<li class="file">${icon(f.key)} ${fn} <span class="muted">(${fmt(f.size)})</span> <a href="/api/files/${encodeURIComponent(f.key)}">descargar</a></li>`;
  }
  html += '</ul>';
  return html;
}

load();
</script>
{% endblock %}
