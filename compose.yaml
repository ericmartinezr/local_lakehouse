name: lakehouse

services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/app/data
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  bucket-setup:
    image: amazon/aws-cli:2.34.48
    depends_on:
      floci:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Esperando a que Floci este listo..."
        for i in $$(seq 1 30); do
          if aws s3 ls > /dev/null 2>&1; then
            break
          fi
          echo "Intento $$i: Floci no disponible, esperando 2s..."
          sleep 2
        done
        echo "Creando bucket lakehouse..."
        if aws s3 mb s3://lakehouse 2>&1; then
          echo "Bucket 'lakehouse' creado exitosamente."
        else
          echo "El bucket 'lakehouse' ya existe o hubo un error."
        fi
        echo "Buckets disponibles:"
        aws s3 ls

  polaris:
    image: apache/polaris:latest
    ports:
      - "8181:8181"
      - "8182:8182"
    depends_on:
      bucket-setup:
        condition: service_completed_successfully
      polaris-bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: 5
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: 100
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: 5000
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      quarkus.otel.sdk.disabled: "true"
      POLARIS_FEATURES_SKIP__CREDENTIAL__SUBSCOPING__INDIRECTION: "true"
      POLARIS_FEATURES_ALLOW__EXTERNAL__CATALOG__CREDENTIAL__VENDING: "false"
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "*"
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: Content-Type,Authorization,Polaris-Realm,X-Request-ID
      QUARKUS_HTTP_CORS_EXPOSED_HEADERS: "*"
      QUARKUS_HTTP_CORS_ACCESS_CONTROL_ALLOW_CREDENTIALS: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  polaris-bootstrap:
    image: apache/polaris-admin-tool:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        OUTPUT=$$(java -jar /deployments/polaris-admin-tool.jar \
          bootstrap --realm=POLARIS --credential=POLARIS,root,s3cr3t 2>&1)
        RC=$$?
        echo "$$OUTPUT"
        if [ $$RC -ne 0 ]; then
          echo "$$OUTPUT" | grep -q "already been bootstrapped" && \
            { echo "Polaris DB already bootstrapped, continuing..."; exit 0; }
          exit $$RC
        fi

  polaris-setup:
    image: alpine/curl:8.19.0
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      ROOT_CLIENT_ID: root
      ROOT_CLIENT_SECRET: s3cr3t
      REALM: POLARIS
    volumes:
      - ./scripts/bootstrap-polaris.sh:/bootstrap.sh
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/polaris-setup-done"]
      interval: 1s
      timeout: 10s
      retries: 300
      start_period: 1s

  polaris-console:
    build: ./polaris-console
    ports:
      - "4000:4000"
    environment:
      VITE_POLARIS_API_URL: http://localhost:8181
      VITE_POLARIS_REALM: POLARIS
      VITE_POLARIS_PRINCIPAL_SCOPE: PRINCIPAL_ROLE:ALL
      VITE_OAUTH_TOKEN_URL: http://localhost:8181/api/catalog/v1/oauth/tokens
    depends_on:
      polaris-setup:
        condition: service_healthy

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    shm_size: 128mb
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
      POSTGRES_DB: polaris
    volumes:
      - polaris-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  trino:
    image: trinodb/trino:latest
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      polaris-setup:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  floci-data:
  polaris-db:
